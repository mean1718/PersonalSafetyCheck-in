name: safetyu_app
description: "SafetyU — Personal safety check-in & alert companion app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_maps_flutter: ^2.9.0
  google_polyline_algorithm: ^3.1.0
  geolocator: ^10.1.0
  geocoding: ^4.0.0
  share_plus: ^7.2.1
  url_launcher: ^6.3.1
  http: ^1.2.0
  image_picker: ^1.0.7
  qr_flutter: ^4.1.0

  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  flutter_secure_storage: ^10.3.4
  latlong2: ^0.9.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/login_illustration.png
    - assets/images/account_type_illustration.png
    - assets/images/add_contact_background.png
    - assets/images/safetyu_logo.png
    - assets/images/safetyu_logo_android12.png
    - assets/images/marker_blue.png
    - assets/images/marker_red.png
    - assets/images/marker_orange.png
    - assets/images/marker_violet.png

flutter_native_splash:
  color: "#0B1220"
  image: assets/images/safetyu_logo.png
  android_12:
    image: assets/images/safetyu_logo_android12.png
    color: "#0B1220"